name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t neurocare-api .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 neurocare-api
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'; then
              echo "Container is healthy and the model is loaded"
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1
